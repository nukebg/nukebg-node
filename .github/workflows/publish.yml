name: Publish to npm
# Runs when a GitHub release is published. Authenticates with npm trusted publishing (OIDC: no stored
# token) and publishes with provenance. Configured on npmjs.com for nukebg/nukebg-node, publish.yml,
# environment "npm".
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - run: npm publish --provenance --access public
