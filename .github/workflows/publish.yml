name: Publish to npm
# Runs when a GitHub release is published. Uses npm trusted publishing (OIDC, no stored token) with
# provenance. For the very first release, before trusted publishing is set up on npmjs.com, add a
# short-lived granular token as the NPM_TOKEN secret; delete it once trusted publishing is configured.
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
